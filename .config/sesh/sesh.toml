#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
[[session]]
name = "Downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "dotfiles"
path = "~/.dotfiles"
startup_command = 'nvim -c ":lua FzfLua.files()"'
windows = ["lazygit"]

[[session]]
name = "Phoenix"
path = "~/Developer/elixir/pento"
startup_command = 'nvim -c ":lua FzfLua.files()"'
windows = ["lazygit"]

[[session]]
name = "App Development"
path = "~/Developer/Android/CamperVanCompose"
windows = ["lazygit", "gh-dash"]

[[window]]
name = "lazygit"
startup_script = "lazygit"

[[window]]
name = "gh-dash"
startup_script = "gh dash"
