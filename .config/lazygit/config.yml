git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  branchLogCmd: "git log --graph --color=always --pretty=custom"
  mainBranches: [master, main, develop]
  commitPrefixes:
    android: # repository folder name
      - pattern: "(IMOWAPP-[0-9]{4}).*" # extraxt ticket number from branch name and place it in commit message
        replace: "[$1]"
  allBranchesLogCmds:
    - git log --graph --color=always --pretty=custom
gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  enlargedSideViewLocation: top
  showBottomLine: true
  theme:
    activeBorderColor:
      - "#f9e2af"
      - bold
    inactiveBorderColor:
      - "#838ba7"
    optionsTextColor:
      - "#8caaee"
    selectedLineBgColor:
      - "#414559"
      - bold
    cherryPickedCommitBgColor:
      - "#81c8be"
    cherryPickedCommitFgColor:
      - "#8caaee"
    unstagedChangesColor:
      - "#ea999c"
    authorColors:
      "Carmen Geelhaar": "#ca9ee6"
      "camina": "#ca9ee6"
      "*": "#85c1dc"
    branchColorPatterns:
      "^release(/|$)": "#838ba7" # for branches beginning with 'release/'
  spinner:
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
    rate: 80
os:
  editPreset: "nvim"
